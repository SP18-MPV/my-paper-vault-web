name: Deploy Dev

on:
  push:
    branches:
      - dev

# Cancel in-progress run if a new push arrives.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest

    # Required for OIDC — lets GitHub request a short-lived AWS token.
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build ─────────────────────────────────────────────────────────
      # VITE_* variables are baked into the JS bundle at this step.
      - name: Build
        env:
          VITE_API_URL: ${{ secrets.DEV_VITE_API_URL }}
          VITE_APP_VERSION: ${{ github.sha }}
          # Deep link the web app redirects to after a successful subscription
          # payment, to send the user back into the mobile app. Fixed literal
          # value (not a secret, not environment-specific — same scheme for
          # dev and prod), per the welcome-email/web-payments feature's
          # requirements. The mypapervault:// scheme itself is registered in
          # the mobile app's own code, not anything server-side.
          VITE_MOBILE_RETURN_URL: mypapervault://subscription/success
        run: npm run build

      # ── 5. Configure AWS credentials (OIDC) ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 6. Upload to S3 ───────────────────────────────────────────────────
      # --delete removes files from S3 that no longer exist in dist/.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://mypapervault-dev-web \
            --delete \
            --cache-control "no-cache" \
            --exclude "assets/*"

          # Assets have hashed filenames — safe to cache for 1 year.
          aws s3 sync dist/assets/ s3://mypapervault-dev-web/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # ── 7. Invalidate CloudFront cache ────────────────────────────────────
      # Only invalidate non-asset files (index.html etc.) — assets are immutable.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
